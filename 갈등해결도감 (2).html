<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 모둠의 갈등해결도감 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 배달의민족 주아 (없으면 거의 같은 모양의 Google Fonts 'Jua'가 자동 적용됩니다) */
@font-face{
  font-family:'BMJua';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0.0/BMJUA.woff') format('woff');
  font-weight:normal;font-style:normal;font-display:swap;
}
:root{
  --ink:#5a4636; --cream:#fff6dc; --paper:#fffdf6;
  --pink:#ff9db8; --pink-l:#ffe3ec; --mint:#8fdcc3; --mint-l:#dcf6ec;
  --sky:#8ccbf5; --sky-l:#dcefff; --yellow:#ffd666; --yellow-l:#fff0b8;
  --c1:#2f6fed; --c2:#e8467c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'BMJua','Jua','Gowun Dodum','Malgun Gothic',sans-serif;
  color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(#ffe7a3 3px, transparent 3.5px);
  background-size:36px 36px;
  min-height:100vh;
  font-size:20px; line-height:1.5;
}
#app{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
.topbar{text-align:center;margin-bottom:14px}
.title{
  display:inline-block;font-size:clamp(28px,5vw,46px);margin:6px 0 2px;color:var(--ink);
  letter-spacing:-0.5px;
}
.title .hl{background:linear-gradient(transparent 58%, var(--yellow) 58%);padding:0 6px}
.sub{font-size:18px;opacity:.75}

.panel{
  background:var(--paper);border:4px solid var(--ink);border-radius:30px;
  box-shadow:0 8px 0 var(--ink);padding:26px 28px;margin:14px 0 22px;
}
.panel h2{margin:0 0 6px;font-size:30px;font-weight:normal}
.hint{font-size:18px;opacity:.8;margin:0 0 16px}

/* 진행 표시 */
.stages{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 6px}
.stage{
  border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:16px;background:#fff;opacity:.55
}
.stage.on{background:var(--yellow);opacity:1}
.stage.done{background:var(--mint-l);opacity:1}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;max-width:520px;margin:6px auto 0}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}

/* 모둠 선택 */
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.gbtn{
  font-family:inherit;font-size:26px;color:var(--ink);cursor:pointer;
  border:4px solid var(--ink);border-radius:26px;padding:18px 6px 14px;background:#fff;
  box-shadow:0 6px 0 var(--ink);transition:transform .08s, box-shadow .08s;
}
.gbtn .ge{display:block;font-size:52px;line-height:1.1;margin-bottom:4px}
.gbtn:hover{transform:translateY(-2px)}
.gbtn.on{background:var(--yellow);transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.gbtn:nth-child(1).on{background:var(--pink-l)}
.gbtn:nth-child(2).on{background:var(--yellow-l)}
.gbtn:nth-child(3).on{background:var(--mint-l)}
.gbtn:nth-child(4).on{background:var(--sky-l)}
.gbtn:nth-child(5).on{background:#eadcff}

/* 상황 */
.situation{
  font-size:25px;line-height:1.75;background:var(--yellow-l);
  border:3px dashed var(--ink);border-radius:22px;padding:20px 24px;
}
.nm{font-weight:bold;font-size:1.06em}
.chars{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.chartag{display:flex;align-items:center;gap:8px;font-size:20px}
.av{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;color:#fff;border:3px solid var(--ink);font-size:21px;flex:none
}

/* 입력 */
label.lb{display:block;font-size:22px;margin:16px 0 6px}
textarea{
  width:100%;font-family:inherit;font-size:21px;color:var(--ink);
  border:3px solid var(--ink);border-radius:18px;padding:12px 14px;background:#fff;resize:vertical;min-height:96px;
  outline:none;
}
textarea:focus{background:#fffbe8;box-shadow:0 0 0 4px var(--yellow)}
textarea::placeholder{color:#b9a592}
.feel{border:3px solid var(--ink);border-radius:22px;padding:6px 18px 18px;margin-bottom:14px;background:#fff}
.feel .who{display:flex;align-items:center;gap:10px;font-size:26px;margin-top:12px}

/* 해결방법 선택 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chip{
  font-family:inherit;font-size:19px;color:var(--ink);cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;
  border:3px solid var(--ink);border-radius:18px;background:#fff;padding:9px 12px;line-height:1.25;
}
.chip .ce{font-size:30px;flex:none}
.chip span:last-child{word-break:keep-all}
.chip:hover:not(:disabled){background:var(--sky-l)}
.chip.on{background:var(--pink);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.chip:disabled{opacity:.35;cursor:not-allowed;background:#eee}
.picked{
  display:flex;align-items:center;gap:16px;border:3px dashed var(--ink);border-radius:22px;
  padding:10px 20px;margin:16px 0 4px;background:var(--mint-l);font-size:28px;min-height:84px
}
.picked .big{font-size:56px;line-height:1}
.picked.empty{background:#f6f1e6;font-size:20px;opacity:.8}
.spk{display:flex;gap:10px;flex-wrap:wrap}
.spkbtn{
  font-family:inherit;font-size:21px;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 16px 5px 6px;
}
.spkbtn.on{background:var(--yellow);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.quote{position:relative}
.quote .q{position:absolute;font-size:34px;line-height:1;opacity:.5}
.ex{background:var(--sky-l);border:3px solid var(--ink);border-radius:18px;padding:10px 16px;font-size:19px;margin-top:6px}

/* 버튼 */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.btn{
  font-family:inherit;font-size:26px;color:var(--ink);cursor:pointer;
  border:4px solid var(--ink);border-radius:999px;padding:10px 34px;background:var(--mint);
  box-shadow:0 6px 0 var(--ink);transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.back{background:#fff}
.btn.go{background:var(--pink)}
.btn.pdf{background:var(--yellow)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;border-radius:999px;padding:12px 26px;font-size:21px;transition:.25s;z-index:50;
  max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{
  position:fixed;inset:0;background:var(--cream);z-index:9999;display:none;align-items:center;justify-content:center;
  flex-direction:column;font-size:30px;gap:12px;text-align:center;padding:20px
}
.overlay.show{display:flex}
.overlay .em{font-size:80px}

/* 해결방법 탭 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.tab{
  font-family:inherit;font-size:22px;color:var(--ink);cursor:pointer;
  border:3px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;background:#fff;
  padding:8px 22px 6px;margin-bottom:-3px;opacity:.7
}
.tab:hover{background:var(--sky-l);opacity:1}
.tab.on{background:var(--pink);opacity:1;padding-bottom:9px}
.tabbody{border:3px solid var(--ink);border-radius:0 22px 22px 22px;padding:14px 20px 22px;background:var(--paper)}
.tabbody .hint{margin-bottom:12px}
textarea.warn,.chips.warn{box-shadow:0 0 0 4px var(--pink)}

/* 미리보기 */
#previewOuter{margin:0 auto;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);background:#fff;overflow:hidden;border-radius:10px}
#scaler{width:1587px;transform-origin:top left}

/* ===== 포스터 (A2 비율 420:594mm = 1587:2245px) ===== */
.poster{
  width:1587px;min-height:2245px;padding:56px;
  background-color:#fff0c4;background-image:radial-gradient(#ffdc82 5px, transparent 5.5px);background-size:56px 56px;
  font-family:'BMJua','Jua','Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);line-height:1.5;
}
.p-frame{
  min-height:2133px;background:#fffdf6;border:12px solid var(--ink);border-radius:70px;padding:56px 64px 48px;
  display:flex;flex-direction:column;gap:38px;position:relative;
}
.p-head{text-align:center}
.p-top{font-size:40px;margin-bottom:6px}
.p-title{font-size:132px;line-height:1.15;margin:0;font-weight:normal;letter-spacing:-2px}
.p-title span{background:linear-gradient(transparent 62%, var(--yellow) 62%);padding:0 18px}
.p-tag{font-size:42px;margin-top:10px;opacity:.8}
.p-sec h3{
  display:inline-block;margin:0 0 20px;font-size:54px;font-weight:normal;
  background:var(--pink);border:6px solid var(--ink);border-radius:999px;padding:4px 40px 4px 18px;box-shadow:0 8px 0 var(--ink);
}
.p-sec h3 .n{
  display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;
  background:#fff;border:5px solid var(--ink);margin-right:14px;font-size:44px
}
.p-sec.s2 h3{background:var(--sky)}
.p-sec.s3 h3{background:var(--mint)}
.p-sec.s4 h3{background:var(--yellow)}
.p-sit{
  font-size:46px;line-height:1.7;background:var(--yellow-l);border:6px dashed var(--ink);border-radius:44px;padding:34px 44px;
}
.p-sit .nm{font-size:1.06em}
.p-feels{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.p-feel{display:flex;gap:20px;align-items:flex-start}
.p-av{
  width:110px;height:110px;border-radius:50%;border:6px solid var(--ink);color:#fff;font-size:56px;
  display:flex;align-items:center;justify-content:center;flex:none
}
.p-bubble{
  position:relative;flex:1;background:#fff;border:6px solid var(--ink);border-radius:40px;padding:22px 30px;font-size:42px;min-height:150px;
  box-shadow:0 8px 0 var(--ink)
}
.p-bubble:before{
  content:"";position:absolute;left:-30px;top:40px;width:0;height:0;border:22px solid transparent;border-right:30px solid var(--ink);border-left:0;
}
.p-bubble:after{
  content:"";position:absolute;left:-19px;top:45px;width:0;height:0;border:17px solid transparent;border-right:24px solid #fff;border-left:0;
}
.p-bubble .who{font-size:44px;display:block;margin-bottom:4px}
.p-bubble p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.p-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.p-card{
  border:7px solid var(--ink);border-radius:50px;padding:28px 28px 30px;box-shadow:0 12px 0 var(--ink);
  position:relative;display:flex;flex-direction:column;gap:14px;text-align:center
}
.p-card.c0{background:var(--pink-l)} .p-card.c1{background:var(--mint-l)} .p-card.c2{background:var(--sky-l)}
.p-badge{
  align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:2px 34px;font-size:40px
}
.p-emoji{font-size:150px;line-height:1.1}
.p-ctitle{font-size:56px;line-height:1.2;min-height:68px}
.p-say{background:#fff;border:5px solid var(--ink);border-radius:32px;padding:18px 22px;font-size:42px;text-align:left}
.p-say b{display:block;font-size:40px;font-weight:normal;margin-bottom:2px}
.p-say p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.p-eff{text-align:left;font-size:38px;padding:0 6px}
.p-efflabel{font-size:40px;margin-bottom:2px}
.p-eff p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.p-sim{
  font-size:46px;line-height:1.65;background:#fff;border:6px solid var(--ink);border-radius:44px;padding:30px 44px;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 8px 0 var(--ink)
}
.p-foot{margin-top:auto;text-align:center;font-size:38px;opacity:.7;padding-top:6px}

@media (max-width:720px){
  .groups{grid-template-columns:repeat(2,1fr)}
  .panel{padding:20px 16px}
  .situation{font-size:22px}
}
@page{size:A2 portrait;margin:0}
@media print{
  body{background:#fff}
  .topbar,.nav,.toast,.overlay,.noprint{display:none !important}
  #app{max-width:none;padding:0;margin:0}
  #previewOuter{width:auto !important;height:auto !important;border:0;box-shadow:none;border-radius:0}
  #scaler{transform:none !important}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">🧩 우리 모둠의 <span class="hl">갈등해결도감</span> 만들기</div>
    <div id="progress"></div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="em">🖨️</div><div>포스터를 PDF로 만드는 중이에요…<br>잠깐만 기다려 주세요!</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  'use strict';

  var C1 = '#2f6fed', C2 = '#e8467c';

  /* ===== 모둠별 데이터 ===== */
  var G = {
    1:{ animal:'🐶',
        situation:'쉬는 시간에 교실 뒤에 딱 하나 남은 인기 있는 보드게임(또는 공)을 민준이와 서연이가 동시에 잡았습니다. 민준이는 "내가 먼저 잡았어!"라고 하고, 서연이는 "내가 먼저 찜했어!"라며 서로 놓지 않고 짜증을 내고 있습니다.',
        chars:[{name:'민준이',color:C1},{name:'서연이',color:C2}], re:/(민준이|서연이)/g },
    2:{ animal:'🐱',
        situation:'미술 시간, 모둠별로 하나의 큰 도화지에 \'상상 속의 마을\'을 그려야 합니다. 지훈이는 "우주 마을을 그리자!"라고 하고, 수진이는 "바닷속 마을이 훨씬 예뻐!"라며 자기 의견을 굽히지 않습니다. 도화지에는 아직 아무것도 그리지 못했고 시간은 자꾸 흘러갑니다.',
        chars:[{name:'지훈이',color:C1},{name:'수진이',color:C2}], re:/(지훈이|수진이)/g },
    3:{ animal:'🐰',
        situation:'유나가 지나가다가 실수로 책상을 쳐서 지민이의 필통이 바닥에 떨어져 연필심이 다 부러졌습니다. 지민이는 유나가 일부러 그랬다고 생각해서 "너 왜 남의 걸 함부로 쳐!"라며 화를 냈고, 유나는 억울해서 "일부러 그런 거 아니거든!" 하고 소리를 질렀습니다.',
        chars:[{name:'유나',color:C1},{name:'지민이',color:C2}], re:/(유나|지민이)/g },
    4:{ animal:'🐻',
        situation:'체육 시간 피구 경기 중, 태우가 공에 살짝 스친 것 같은데 맞지 않았다고 우기며 밖으로 나가지 않습니다. 상대 팀인 현우는 "너 옷에 스쳤잖아! 빨리 나가!"라고 소리치고, 경기가 중단된 채 아이들끼리 편이 갈려 싸우고 있습니다.',
        chars:[{name:'태우',color:C1},{name:'현우',color:C2}], re:/(태우|현우)/g },
    5:{ animal:'🐼',
        situation:'동현이가 재미있다며 승민이의 이름으로 이상한 별명을 부르며 계속 장난을 칩니다. 승민이는 단호하게 "그렇게 부르지 마, 기분 나빠."라고 거절하고 자리를 피했지만, 동현이는 계속 따라오며 놀립니다. 승민이는 폭발하기 일보 직전입니다.',
        chars:[{name:'동현이',color:C1},{name:'승민이',color:C2}], re:/(동현이|승민이)/g }
  };

  var SOLUTIONS = [
    {n:'사과하기',e:'🙇'},
    {n:'내 마음 말하기',e:'💬'},
    {n:'상대방 이야기 들어보기',e:'👂'},
    {n:'차례 정하기',e:'🔢'},
    {n:'나누어 함께 쓰기',e:'🍰'},
    {n:'서로 조금씩 양보하기',l:'서로 조금씩<br>양보하기',e:'🕊️'},
    {n:'시간 약속 정하기',e:'⏰'},
    {n:'잠시 진정 후 다시 이야기하기',e:'🧘'},
    {n:'함께 규칙 만들기',e:'📜'},
    {n:'다른 방법 찾기',e:'💡'},
    {n:'어른께 도움 요청하기',l:'어른께<br>도움 요청하기',e:'🙋'},
    {n:'가위바위보로 정하기',l:'가위바위보로<br>정하기',e:'✌️'}
  ];

  var STEPS = ['group','main','poster'];
  var STAGES = ['상황 제시','속마음 살피기','추천 해결 방법','이런 상황에서도'];

  function freshState(){
    return {
      step:0, group:null, tab:0,
      feelings:['',''],
      sols:[0,1,2].map(function(){ return {type:-1, speaker:0, say:'', effect:''}; }),
      similar:''
    };
  }
  var state = freshState();

  /* ===== 유틸 ===== */
  function $(s){ return document.querySelector(s); }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function cleanQuote(s){
    return String(s).trim().replace(/^["“”'‘’]+/,'').replace(/["“”'‘’]+$/,'').trim();
  }
  function hl(text, g){
    var d = G[g];
    return esc(text).replace(d.re, function(m){
      var c = d.chars.filter(function(x){ return x.name === m; })[0];
      return '<b class="nm" style="color:'+c.color+'">'+m+'</b>';
    });
  }
  /* 받침 유무에 따라 조사 선택 (예: 지훈이→는/가, 태우→는/가, 승민→은/이) */
  function hasBatchim(w){
    var ch = String(w).trim().charAt(String(w).trim().length-1).charCodeAt(0);
    if(ch < 0xAC00 || ch > 0xD7A3) return false;
    return (ch - 0xAC00) % 28 !== 0;
  }
  function josa(w, withB, noB){ return hasBatchim(w) ? withB : noB; }
  function avatar(c, cls){
    return '<span class="'+(cls||'av')+'" style="background:'+c.color+'">'+esc(c.name.charAt(0))+'</span>';
  }
  var toastTimer;
  function toast(msg){
    var t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  /* ===== 진행 표시 ===== */
  function solDone(i){
    var o = state.sols[i];
    return o.type>=0 && !!o.say.trim() && !!o.effect.trim();
  }
  function sectionDone(){
    return [
      true,
      !!state.feelings[0].trim() && !!state.feelings[1].trim(),
      solDone(0) && solDone(1) && solDone(2),
      !!state.similar.trim()
    ];
  }
  function renderProgress(){
    var el = $('#progress');
    if(state.step===0){ el.innerHTML = '<div class="sub">우리 모둠의 갈등 상황을 해결하고, 멋진 포스터를 만들어 봐요!</div>'; return; }
    if(STEPS[state.step]==='poster'){ el.innerHTML = '<div class="sub">🎉 포스터가 완성되었어요!</div>'; return; }
    var d = sectionDone(), cur = d.indexOf(false), cnt = 0;
    var chips = STAGES.map(function(n,i){
      if(d[i]) cnt++;
      return '<span class="stage '+(i===cur?'on':(d[i]?'done':''))+'">'+(i+1)+'. '+n+'</span>';
    }).join('');
    var pct = Math.round(cnt / 4 * 100);
    el.innerHTML = '<div class="stages">'+chips+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  }

  /* ===== 화면 ===== */
  function viewGroup(){
    var btns = [1,2,3,4,5].map(function(n){
      return '<button class="gbtn '+(state.group===n?'on':'')+'" data-group="'+n+'"><span class="ge">'+G[n].animal+'</span>'+n+'모둠</button>';
    }).join('');
    return '<div class="panel"><h2>🙌 우리 모둠을 골라요</h2><p class="hint">우리 모둠 번호를 누른 뒤 [다음]을 눌러요.</p><div class="groups">'+btns+'</div></div>'
      + nav(false, '다음 ▶');
  }

  function secSituation(){
    var g = G[state.group];
    var tags = g.chars.map(function(c){
      return '<span class="chartag">'+avatar(c)+'<b style="color:'+c.color+'">'+c.name+'</b></span>';
    }).join('');
    return '<div class="panel" id="sec1"><h2>1. 상황 제시 📖</h2><p class="hint">'+state.group+'모둠의 갈등 상황을 천천히 읽어 보세요.</p>'
      + '<div class="situation">'+hl(g.situation, state.group)+'</div>'
      + '<div class="chars">'+tags+'</div></div>';
  }

  function secFeelings(){
    var g = G[state.group];
    var html = g.chars.map(function(c,i){
      return '<div class="feel"><div class="who">'+avatar(c)+'<b style="color:'+c.color+'">'+c.name+'</b>의 속마음</div>'
        + '<textarea data-f="feel'+i+'" placeholder="'+c.name+josa(c.name,'은','는')+' 지금 어떤 마음일까요? 왜 그렇게 말하고 행동했을까요?">'+esc(state.feelings[i])+'</textarea></div>';
    }).join('');
    return '<div class="panel" id="sec2"><h2>2. 속마음 살피기 💭</h2><p class="hint">두 친구의 마음이 되어 속마음을 써 보세요.</p>'+html+'</div>';
  }

  function tabLabel(i){
    var s = state.sols[i];
    return '방법 '+(i+1)+' '+(s.type>=0 ? SOLUTIONS[s.type].e : '🧰')+(solDone(i) ? ' ✔' : '');
  }
  function updateTabs(){
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){ tabs[i].innerHTML = tabLabel(i); }
  }

  function solBody(i){
    var g = G[state.group], s = state.sols[i];
    var used = state.sols.map(function(x,j){ return j!==i ? x.type : -2; });
    var chips = SOLUTIONS.map(function(o,k){
      var dis = used.indexOf(k) !== -1;
      return '<button class="chip '+(s.type===k?'on':'')+'" data-type="'+k+'" '+(dis?'disabled title="다른 방법 카드에서 이미 골랐어요"':'')+'><span class="ce">'+o.e+'</span><span>'+(o.l||o.n)+'</span></button>';
    }).join('');
    var picked = s.type>=0
      ? '<div class="picked"><span class="big">'+SOLUTIONS[s.type].e+'</span><b>'+SOLUTIONS[s.type].n+'</b></div>'
      : '<div class="picked empty">👆 위에서 해결 방법을 하나 골라 보세요. 그림이 나타나요!</div>';
    var spk = g.chars.map(function(c,k){
      return '<button class="spkbtn '+(s.speaker===k?'on':'')+'" data-speaker="'+k+'">'+avatar(c)+'<b style="color:'+c.color+'">'+c.name+'</b></button>';
    }).join('');
    var sp = g.chars[s.speaker];
    return '<p class="hint">해결 방법 '+(i+1)+'/3 · 세 가지 방법은 서로 다르게 골라요.</p>'
      + '<div class="chips">'+chips+'</div>'+picked
      + '<label class="lb">🗣️ 누가 말하게 될까요?</label><div class="spk">'+spk+'</div>'
      + '<label class="lb"><b style="color:'+sp.color+'">'+sp.name+'</b>'+josa(sp.name,'이','가')+' 하게 될 말</label>'
      + '<textarea data-f="say" placeholder="예) 내가 먼저 하겠다고 우겨서 미안해. 우리 가위바위보로 정할까?">'+esc(s.say)+'</textarea>'
      + '<label class="lb">✨ 이렇게 하면 어떤 좋은 일이 생길까요? (기대효과)</label>'
      + '<textarea data-f="effect" placeholder="예) 서로 기분이 풀리고, 싸우지 않고 같이 놀 수 있어요.">'+esc(s.effect)+'</textarea>';
  }

  function secSol(){
    var tabs = [0,1,2].map(function(i){
      return '<button class="tab '+(state.tab===i?'on':'')+'" data-tab="'+i+'">'+tabLabel(i)+'</button>';
    }).join('');
    return '<div class="panel" id="sec3"><h2>3. 추천 해결 방법 🧰</h2>'
      + '<p class="hint">탭을 눌러 방법 1, 2, 3을 차례로 채워 보세요.</p>'
      + '<div class="tabs">'+tabs+'</div><div class="tabbody">'+solBody(state.tab)+'</div></div>';
  }

  function secSimilar(){
    return '<div class="panel" id="sec4"><h2>4. 이런 상황에서도 쓸 수 있어요 🌈</h2>'
      + '<div class="ex">💡 <b>도움말</b> : 이 해결방법들을 적용할 수 있는 비슷한 상황을 만들어 적어보세요.<br>예) 이 방법은 그네를 서로 타려고 할 때도 쓸 수 있어요.</div>'
      + '<label class="lb">우리가 생각한 비슷한 상황</label>'
      + '<textarea data-f="similar" placeholder="~할 때 또는 ~하는 상황">'+esc(state.similar)+'</textarea></div>';
  }

  function viewMain(){
    return secSituation() + secFeelings() + secSol() + secSimilar() + nav(true, '제출 ✔');
  }

  function nav(hasBack, nextText){
    return '<div class="nav">'
      + (hasBack ? '<button class="btn back" id="btnBack">◀ 이전</button>' : '<span></span>')
      + '<button class="btn go" id="btnNext">'+nextText+'</button></div>';
  }

  /* ===== 포스터 ===== */
  function posterHTML(){
    var n = state.group, g = G[n];
    var feels = g.chars.map(function(c,i){
      return '<div class="p-feel">'+avatar(c,'p-av')
        + '<div class="p-bubble"><b class="who" style="color:'+c.color+'">'+c.name+'</b><p>'+esc(state.feelings[i])+'</p></div></div>';
    }).join('');
    var cards = state.sols.map(function(s,i){
      var o = SOLUTIONS[s.type], sp = g.chars[s.speaker];
      return '<div class="p-card c'+i+'"><div class="p-badge">방법 '+(i+1)+'</div>'
        + '<div class="p-emoji">'+o.e+'</div><div class="p-ctitle">'+o.n+'</div>'
        + '<div class="p-say"><b style="color:'+sp.color+'">'+sp.name+'</b><p>“'+esc(cleanQuote(s.say))+'”</p></div>'
        + '<div class="p-eff"><div class="p-efflabel">✨ 기대 효과</div><p>'+esc(s.effect)+'</p></div></div>';
    }).join('');
    return '<div class="poster"><div class="p-frame">'
      + '<div class="p-head"><div class="p-top">🌟 🧩 🌈 🧩 🌟</div>'
      + '<h1 class="p-title"><span>'+n+'모둠</span>의 갈등해결도감</h1>'
      + '<div class="p-tag">친구와 마음이 부딪힐 때, 우리는 이렇게 해결해요!</div></div>'
      + '<div class="p-sec s1"><h3><span class="n">📖</span>상황</h3><div class="p-sit">'+hl(g.situation,n)+'</div></div>'
      + '<div class="p-sec s2"><h3><span class="n">💭</span>속마음</h3><div class="p-feels">'+feels+'</div></div>'
      + '<div class="p-sec s3"><h3><span class="n">🧰</span>추천 해결 방법</h3><div class="p-cards">'+cards+'</div></div>'
      + '<div class="p-sec s4"><h3><span class="n">🌈</span>이런 상황에서도 쓸 수 있어요</h3><div class="p-sim">'+esc(state.similar)+'</div></div>'
      + '<div class="p-foot">🧩 '+n+'모둠이 함께 만든 갈등해결도감 🧩</div>'
      + '</div></div>';
  }

  function viewPoster(){
    return '<div id="previewOuter"><div id="scaler">'+posterHTML()+'</div></div>'
      + '<div class="nav noprint" style="margin-top:22px">'
      + '<button class="btn back" id="btnBack">◀ 이전</button>'
      + '<button class="btn pdf" id="btnPdf">📄 PDF로 저장하기</button></div>'
      + '<p class="hint noprint" style="text-align:center;margin-top:14px">내용을 고치고 싶으면 [이전]을 눌러 돌아가세요. 포스터는 A2 크기(420×594mm)로 저장돼요.</p>';
  }

  function fitPreview(){
    var outer = $('#previewOuter'), sc = $('#scaler');
    if(!outer || !sc) return;
    var avail = Math.min(window.innerWidth - 32, 1008);
    var scale = avail / 1587;
    sc.style.transform = 'scale('+scale+')';
    outer.style.width = (1587*scale + 8) + 'px';
    outer.style.height = (sc.offsetHeight*scale + 8) + 'px';
  }

  /* ===== 렌더링 ===== */
  function render(keepScroll){
    var y = window.scrollY;
    renderProgress();
    var s = STEPS[state.step], html = '';
    if(s==='group') html = viewGroup();
    else if(s==='main') html = viewMain();
    else if(s==='poster') html = viewPoster();
    $('#main').innerHTML = html;
    if(s==='poster') fitPreview();
    window.scrollTo(0, keepScroll ? y : 0);
  }

  function validate(){
    var s = STEPS[state.step];
    if(s==='group' && !state.group) return {msg:'모둠을 먼저 골라 주세요!'};
    if(s==='main'){
      var g = G[state.group], i;
      for(i=0;i<2;i++){
        if(!state.feelings[i].trim()) return {msg:g.chars[i].name+'의 속마음을 써 주세요!', sel:'textarea[data-f="feel'+i+'"]'};
      }
      for(i=0;i<3;i++){
        var o = state.sols[i];
        if(o.type<0) return {msg:'해결 방법 '+(i+1)+': 해결 방법을 하나 골라 주세요!', tab:i, sel:'#sec3 .chips'};
        if(!o.say.trim()) return {msg:'해결 방법 '+(i+1)+': 인물이 하게 될 말을 써 주세요!', tab:i, sel:'textarea[data-f="say"]'};
        if(!o.effect.trim()) return {msg:'해결 방법 '+(i+1)+': 기대효과를 써 주세요!', tab:i, sel:'textarea[data-f="effect"]'};
      }
      if(!state.similar.trim()) return {msg:'비슷한 상황을 한 가지 이상 써 주세요!', sel:'textarea[data-f="similar"]'};
    }
    return null;
  }

  function showProblem(v){
    if(v.tab !== undefined && v.tab !== state.tab){ state.tab = v.tab; render(true); }
    toast(v.msg);
    if(!v.sel) return;
    var el = $(v.sel);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    if(el.tagName === 'TEXTAREA'){ el.focus({preventScroll:true}); }
    el.classList.add('warn');
    setTimeout(function(){ el.classList.remove('warn'); }, 2500);
  }

  function go(d){
    state.step = Math.max(0, Math.min(STEPS.length-1, state.step + d));
    render(false);
  }

  /* ===== 이벤트 ===== */
  var main = $('#main');
  main.addEventListener('click', function(e){
    var t = e.target.closest('button');
    if(!t) return;
    if(t.dataset.group){
      var n = +t.dataset.group;
      if(state.group !== n){ state = freshState(); state.group = n; }
      render(true);
    } else if(t.dataset.tab !== undefined){
      state.tab = +t.dataset.tab;
      render(true);
    } else if(t.dataset.type !== undefined){
      state.sols[state.tab].type = +t.dataset.type;
      render(true);
      renderProgress();
    } else if(t.dataset.speaker !== undefined){
      state.sols[state.tab].speaker = +t.dataset.speaker;
      render(true);
    } else if(t.id==='btnNext'){
      var v = validate();
      if(v){ showProblem(v); return; }
      go(1);
    } else if(t.id==='btnBack'){
      go(-1);
    } else if(t.id==='btnPdf'){
      savePDF();
    }
  });
  main.addEventListener('input', function(e){
    var f = e.target.dataset && e.target.dataset.f;
    if(!f) return;
    var v = e.target.value;
    if(f==='feel0') state.feelings[0] = v;
    else if(f==='feel1') state.feelings[1] = v;
    else if(f==='similar') state.similar = v;
    else state.sols[state.tab][f] = v;
    renderProgress();
    updateTabs();
  });
  window.addEventListener('resize', fitPreview);

  /* ===== PDF 저장 (A2) ===== */
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  async function savePDF(){
    if(!window.html2canvas || !window.jspdf){
      alert('PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.\n대신 인쇄 창을 열어 줄게요. [PDF로 저장]을 선택하고, 용지 크기를 A2로 골라 주세요.');
      window.print();
      return;
    }
    var overlay = $('#overlay'), holder = document.createElement('div');
    overlay.classList.add('show');
    holder.style.cssText = 'position:absolute;left:0;top:0;z-index:1;width:1587px;';
    holder.innerHTML = posterHTML();
    document.body.appendChild(holder);
    try{
      window.scrollTo(0,0);
      if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
      await wait(400);
      var el = holder.firstElementChild;
      var canvas = await window.html2canvas(el, {
        scale:1.5, useCORS:true, backgroundColor:'#fff0c4',
        scrollX:0, scrollY:0, windowWidth:1700, logging:false
      });
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({orientation:'portrait', unit:'mm', format:[420,594]});
      var w = 420, h = canvas.height / canvas.width * 420;
      if(h > 594){ h = 594; w = canvas.width / canvas.height * 594; }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (420-w)/2, 0, w, h);
      pdf.save(state.group+'모둠_갈등해결도감.pdf');
      toast('PDF가 저장되었어요! 🎉');
    }catch(err){
      console.error(err);
      alert('PDF를 만들다가 문제가 생겼어요. 인쇄 창에서 [PDF로 저장]을 선택해 주세요.');
      window.print();
    }finally{
      document.body.removeChild(holder);
      overlay.classList.remove('show');
    }
  }

  render(false);
})();
</script>
</body>
</html>
